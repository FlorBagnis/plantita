<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Plantita</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#ffe3ee;--surf:#fff8fb;--ink:#5a2140;--mute:#a0668a;--acc:#ec4a95;--onacc:#fff;--water:#2f9be0;--onwater:#fff;--line:#ffc2da;--pot:#f48aa7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1230;--surf:#162052;--ink:#e4ecff;--mute:#8fa3e0;--acc:#6aa8ff;--onacc:#0c1230;--water:#5ee0ff;--onwater:#0c1230;--line:#2a3a85;--pot:#5b7cff}}
:root[data-theme="dark"]{--bg:#0c1230;--surf:#162052;--ink:#e4ecff;--mute:#8fa3e0;--acc:#6aa8ff;--onacc:#0c1230;--water:#5ee0ff;--onwater:#0c1230;--line:#2a3a85;--pot:#5b7cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) radial-gradient(var(--line) 1.5px,transparent 1.5px) 0 0/22px 22px;color:var(--ink);font:16px/1.45 Fredoka,ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif}
#theme{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surf);font-size:20px;box-shadow:0 3px 0 var(--line)}
main{max-width:480px;margin:0 auto;padding:16px;position:relative;z-index:1}
h1{font-size:28px;margin:4px 0 2px}
.sub{color:var(--mute);margin:0 0 12px}
.stage{background:var(--surf);border:3px solid var(--line);border-radius:32px;padding:12px;text-align:center;box-shadow:0 6px 0 var(--line)}
#plant{width:100%;max-width:260px;height:auto}
#msg{font-size:18px;margin:4px 0 0}
.row{display:flex;align-items:center;gap:12px;margin:14px 0}
#can{width:84px;flex:none}
button{font:inherit;cursor:pointer}
#water{flex:1;padding:14px;border-radius:999px;border:0;background:var(--water);color:var(--onwater);font-weight:600;font-size:17px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
#water:disabled{opacity:.45;cursor:default}
.goals{background:var(--surf);border:3px solid var(--line);border-radius:26px;padding:6px 14px;box-shadow:0 6px 0 var(--line)}
.g{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.g:last-child{border-bottom:0}
.g label{flex:1;min-width:0;overflow-wrap:anywhere}
.x{background:none;border:0;color:var(--mute);font-size:20px;min-width:44px;height:44px}
.pm{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--acc);color:var(--onacc);font-size:24px;font-weight:600;line-height:1;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.pm.m{background:none;border:2px solid var(--line);color:var(--mute);font-size:20px;box-shadow:none}
.ei,.rem input,.add input{padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.rem{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;background:var(--surf);border:3px solid var(--line);border-radius:22px;padding:10px 12px;font-size:15px}
.dw{display:flex;gap:4px;width:100%;justify-content:space-between}
.dw label{flex:1;text-align:center;font-size:13px;color:var(--mute)}
.dw input{display:block;margin:2px auto 0;width:22px;height:22px;accent-color:var(--acc)}
.add{display:flex;gap:8px;margin-top:12px}
.add input{flex:1;background:var(--surf)}
.add button{padding:0 16px;min-height:44px;border-radius:999px;border:0;background:var(--acc);color:var(--onacc);font-weight:600;box-shadow:0 4px 0 rgba(0,0,0,.18)}
#banner{background:#f4d58a;color:#4a3500;border-radius:12px;padding:10px 12px;margin:0 0 12px;display:none}
#phrase{margin:6px 0 0;color:var(--acc);font-style:italic;min-height:1.4em}
#streak{font-weight:700;color:var(--ink)}
.tm{border:1px solid var(--water);background:none;color:var(--water);border-radius:10px;padding:8px 12px;min-height:40px;font-size:14px}
.hist{margin-top:16px;background:var(--surf);border:3px solid var(--line);border-radius:26px;padding:12px 14px;box-shadow:0 6px 0 var(--line)}
.hist h2{margin:0 0 8px;font-size:20px}
.days{display:flex;justify-content:space-between;margin:8px 0}
.d{text-align:center;font-size:12px;color:var(--mute)}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 2px;font-size:16px}
.dot.on{background:var(--acc);border-color:var(--acc)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.st{background:var(--bg);border-radius:16px;padding:8px 12px;font-size:14px;color:var(--mute)}
.st b{display:block;font-size:24px;color:var(--acc)}
#insight{margin:8px 0}
.list{font-size:14px;color:var(--mute);max-height:140px;overflow:auto;margin:8px 0 12px}
.bw{width:100%;margin-top:10px;padding:12px;min-height:44px;border-radius:999px;border:0;background:var(--acc);color:var(--onacc);font-weight:600;box-shadow:0 4px 0 rgba(0,0,0,.18)}
#pdf{background:var(--water);color:var(--onwater)}
.bk{display:flex;gap:8px}
.bk .tm{flex:1}
.deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.deco span{position:absolute;color:var(--acc);animation:tw 3.5s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.8);opacity:.2}50%{transform:scale(1.15);opacity:.7}}
.burst{position:fixed;pointer-events:none;z-index:9;font-size:22px;animation:fl 1.1s ease-out forwards}
@keyframes fl{to{transform:translate(var(--dx),-120px) scale(1.4);opacity:0}}
:root[data-theme="dark"] .h{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .h{display:none}}
footer{text-align:center;color:var(--mute);font-size:14px;margin:22px 0 8px}
.lf,.cn{transition:fill .8s}.nm{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:6px;color:var(--mute)}.nm input{font:inherit;font-weight:600;text-align:center;width:11em;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}#more{margin:8px 0 0}
.lg{transition:transform 1.6s ease-in,opacity 1.6s ease-in;transform-box:fill-box;transform-origin:center}
.lg.fall{transform:translate(var(--fx),100px) rotate(150deg);opacity:0}
.gl{opacity:0;transition:opacity .6s 1.4s}
.gl.on{opacity:1}
#sway{transform-origin:100px 150px}
#plant.s0 #sway{animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
#plant.happy{animation:hop .8s ease-out 3}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}35%{transform:translateY(-16px) scale(.97,1.05)}60%{transform:translateY(0) scale(1.05,.95)}}
#plant.happy #sway{animation:wig .5s ease-in-out 5}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.drop{fill:var(--water);opacity:0}
#plant.pour .drop{animation:dr 1s ease-in 2}
@keyframes dr{0%{transform:translateY(-10px);opacity:0}20%{opacity:1}100%{transform:translateY(90px);opacity:0}}
@media (prefers-reduced-motion:reduce){.deco span{animation:none;opacity:.4}.burst{display:none}#plant,#plant *{animation:none!important}}
</style>
</head>

<main>

</g><g id="tr" style="display:none"><path id="trk" d="M100 152 C97 130 103 108 100 78" stroke="#7a5238" stroke-width="10" fill="none" stroke-linecap="round"/><path d="M100 120 Q84 108 76 94 M100 108 Q116 98 126 86" stroke="#7a5238" stroke-width="5" fill="none" stroke-linecap="round"/><g id="cnp"><circle class="cn" cx="100" cy="52" r="32"/><circle class="cn" cx="70" cy="76" r="24"/><circle class="cn" cx="130" cy="74" r="26"/><circle class="cn" cx="100" cy="86" r="22"/></g><circle class="fr" cx="84" cy="48" r="4" fill="#ff6fa8"/><circle class="fr" cx="112" cy="40" r="4" fill="#ffd34d"/><circle class="fr" cx="128" cy="76" r="4" fill="#ff6fa8"/><circle class="fr" cx="68" cy="80" r="4" fill="#ffd34d"/><circle class="fr" cx="102" cy="82" r="4" fill="#ff6fa8"/></g></g></g>
<path d="M62 150 H138 L130 205 Q129 212 122 212 H78 Q71 212 70 205 Z" fill="var(--pot)"/>
<rect x="56" y="144" width="88" height="14" rx="5" fill="var(--pot)"/>
<ellipse cx="100" cy="150" rx="40" ry="4" fill="#4a3322"/>
<g id="eyes"><circle cx="86" cy="182" r="3.5" fill="#3a1a2e"/><circle cx="114" cy="182" r="3.5" fill="#3a1a2e"/></g><g id="heyes" style="display:none"><path d="M82 184 Q86 177 90 184" stroke="#3a1a2e" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M110 184 Q114 177 118 184" stroke="#3a1a2e" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>
<ellipse cx="78" cy="190" rx="6" ry="3.5" fill="#ff8fb5" opacity=".8"/><ellipse cx="122" cy="190" rx="6" ry="3.5" fill="#ff8fb5" opacity=".8"/>
<path id="mouth" d="M94 188 Q100 196 106 188" stroke="#3a1a2e" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<g id="drops"><circle class="drop" cx="78" cy="20" r="3.5"/><circle class="drop" cx="92" cy="10" r="3" style="animation-delay:.15s"/><circle class="drop" cx="106" cy="18" r="3.5" style="animation-delay:.3s"/><circle class="drop" cx="120" cy="8" r="3" style="animation-delay:.45s"/><circle class="drop" cx="134" cy="20" r="3.5" style="animation-delay:.6s"/></g>
<ellipse class="gl" cx="160" cy="213" rx="11" ry="4" fill="#8a6a3c" transform="rotate(-8 160 213)"/><ellipse class="gl" cx="40" cy="213" rx="11" ry="4" fill="#8a6a3c" transform="rotate(10 40 213)"/><ellipse class="gl" cx="178" cy="215" rx="9" ry="3.5" fill="#7a5c3a" transform="rotate(6 178 215)"/><ellipse class="gl" cx="22" cy="215" rx="9" ry="3.5" fill="#7a5c3a" transform="rotate(-12 22 215)"/>
</svg>
<p id="msg"></p><p id="gr" class="sub" style="margin:4px 0 0"></p><button id="more" class="bw" hidden>🌳 Plantar otro arbolito</button><p id="phrase" aria-live="polite"></p>
</div>
<div class="row">
<svg id="can" viewBox="0 0 120 100" aria-label="Regadera">
<defs><clipPath id="cc"><path d="M20 30 H80 V82 Q80 90 72 90 H28 Q20 90 20 82 Z"/></clipPath></defs>
<path d="M80 44 L108 22 L114 28 L84 62" fill="none" stroke="var(--mute)" stroke-width="5" stroke-linejoin="round"/>
<path d="M20 36 Q4 36 4 52 Q4 66 20 66" fill="none" stroke="var(--mute)" stroke-width="5"/>
<g clip-path="url(#cc)"><rect x="20" y="30" width="60" height="62" fill="var(--line)"/><rect id="fill" x="20" y="90" width="60" height="0" fill="var(--water)" style="transition:all .5s"/></g>
<path d="M20 30 H80 V82 Q80 90 72 90 H28 Q20 90 20 82 Z" fill="none" stroke="var(--mute)" stroke-width="4"/>
</svg>
<button id="water">Regar planta</button>
</div>
<div class="goals" id="goals"></div>
<div class="add"><input id="new" placeholder="Nueva meta, por ejemplo: estudiar" maxlength="40"><input id="mins" type="number" min="0" max="240" placeholder="min" aria-label="Minutos, opcional" style="flex:none;width:72px"><button id="addb">Agregar</button></div>
<section class="hist" id="gsec" hidden style="margin-bottom:16px"><h2>Mi jardín 🌳</h2><div id="gl"></div></section>

<div class="days" id="days"></div>
<div class="stats" id="stats"></div>
<p id="insight"></p>
<div class="list" id="hlist"></div>
<button id="exp" class="bw" hidden>Exportar historial (CSV)</button>
<button id="pdf" class="bw" hidden>Descargar PDF</button></section>

<div style="text-align:center"><button id="scr" class="tm">☁️ Activar sincronización</button>
<div id="sjn" style="margin-top:8px"><input id="sci" class="ei" placeholder="¿Ya tenés un código? Pegalo acá" style="width:62%"> <button id="scj" class="tm">Conectar</button></div>
<div id="sco" hidden><span class="sub">Tu código:</span><br><b id="scv" style="word-break:break-all"></b><br><button id="scc" class="tm" style="margin-top:6px">Copiar código</button> <button id="scx" class="tm">Desconectar</button></div></div>
<button id="reset" class="tm" style="display:block;margin:14px auto 0">Reiniciar desde cero</button>
<footer>Tus metas y tu historial se sincronizan entre tus dispositivos (con tu código).<br>Creado By Flor Bagnis <svg width="15" height="15" viewBox="0 0 24 24" style="vertical-align:-2px;fill:var(--acc)" aria-label="corazón"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.5 5c2 0 3.6 1.1 5.5 3 1.9-1.9 3.5-3 5.5-3 3.5 0 5.6 3.4 4.1 6.8C19.500 16.400 12 21 12 21z"/></svg><br>para incentivarte a cumplir tus metas</footer>
</main>
<script>
var KEY="plantita-v1",DAY=864e5,EDIT=null,DELC=null,dtm;
function fresh(){return{goals:[{id:1,t:"Estudiar",min:30},{id:2,t:"Caminar",min:20},{id:3,t:"Leer 10 páginas",min:0}],cnt:{},units:0,pend:{},pendMin:0,lastWater:Date.now(),wateredDate:"",days:[0,1,2,3,4,5,6],growth:0,name:"Plantita",garden:[]}}
var S=fresh();
function merge(r){var k;if(r&&typeof r==="object"&&Array.isArray(r.goals)){for(k in r)S[k]=r[k];if(r.growth===undefined)S.growth=Math.min(12,(S.history||[]).length)}}
try{merge(JSON.parse(localStorage.getItem(KEY)))}catch(e){}
(function(){var lim=Date.now()-45*DAY;Object.keys(S.cnt||{}).forEach(function(k){var p=k.split("-");if(new Date(+p[0],p[1]-1,+p[2]).getTime()<lim)delete S.cnt[k]})})();
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){S.mod=Date.now();saveLocal();push()}
function pd(n){return n<10?"0"+n:""+n}
function dk(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function today(){return dk(new Date())}
function ykey(){return dk(new Date(Date.now()-DAY))}
function stage(){var h=(Date.now()-S.lastWater)/36e5;return h<24?0:h<48?1:h<72?2:3}
function gstage(){var w=S.growth||0;return w<2?0:w<5?1:w<8?2:w<12?3:4}
var STG=["un brote","una plantita","un arbusto","un arbolito","un árbol"];
function need(){return Math.min(10,3+Math.floor((S.history||[]).length/3))}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(ms){ms=Math.max(0,Math.ceil(ms/1000));var m=Math.floor(ms/60),s=ms%60;return m+":"+pd(s)}
function say(t){document.getElementById("phrase").textContent=t}
var COL=["#3f9a4f","#7fa646","#b59a3a","#7a5c3a"],ROT=[0,6,14,24],
MSG=["¡La planta está feliz!","Tiene sed: se está inclinando.","Se está secando. Regala agua hoy.","Se secó del todo. Regala agua para revivirla."];
function render(){
var g=S.goals,nd=need(),u=S.units||0,full=u>=nd,ratio=Math.min(1,u/nd),cn=(S.cnt&&S.cnt[today()])||{};
var f=document.getElementById("fill");f.setAttribute("height",62*ratio);f.setAttribute("y",92-62*ratio);
var b=document.getElementById("water");b.disabled=!full;
b.textContent=full?"Regar planta":"Regadera: "+u+" de "+nd;
document.getElementById("level").textContent="Nivel "+(nd-2)+": cada riego necesita "+nd+" aguas"+(nd>=10?" (máximo)":"")+". Cada meta que cumplís suma 1 agua.";
var s=stage();document.querySelectorAll(".lf,.cn").forEach(function(e){e.setAttribute("fill",COL[s])});
var G=gstage(),tree=G>=3,K=[.5,.75,1,.78,1][G],gw=S.growth||0;
document.getElementById("top").style.transform="rotate("+ROT[s]+"deg) scale("+K+")";
document.getElementById("leaves").style.display=document.getElementById("stem").style.display=tree?"none":"";
document.getElementById("tr").style.display=tree?"":"none";
document.getElementById("trk").setAttribute("stroke-width",G>=4?15:10);
document.getElementById("cnp").style.opacity=[1,1,.85,.6][s];
document.querySelectorAll(".fr").forEach(function(e){e.style.display=(G>=4&&s===0)?"":"none"});
var pn=document.getElementById("pname");if(document.activeElement!==pn)pn.value=S.name||"Plantita";
document.getElementById("gr").textContent=(S.name||"Plantita")+" es "+STG[G]+" · "+gw+" de 12 riegos"+(gw>=12?" ✨":"");
document.getElementById("more").hidden=gw<12;
var gd=S.garden||[];document.getElementById("gsec").hidden=!gd.length;
document.getElementById("gl").innerHTML=gd.map(function(t){return '<div class="g"><span style="font-size:26px">🌳</span><label>'+esc(t.name)+'<br><small>'+esc(t.date)+'</small></label></div>'}).join("");
document.getElementById("plant").classList.toggle("s0",s===0);
var fe=[0,1,3,4][s],ord=[1,0,3,2],lg=document.querySelectorAll(".lg"),gl=document.querySelectorAll(".gl");
ord.forEach(function(li,i){lg[li].classList.toggle("fall",i<fe);if(gl[i])gl[i].classList.toggle("on",i<fe)});
document.getElementById("stem").setAttribute("stroke",s>2?"#7a5c3a":"#3f8a4a");
document.getElementById("msg").textContent=MSG[s];
document.getElementById("mouth").setAttribute("d",s>=2?"M94 195 Q100 188 106 195":"M94 188 Q100 196 106 188");
var sk=(S.lastStreak===today()||S.lastStreak===ykey())?(S.streak||0):0;
document.getElementById("streak").textContent=sk?"Racha: "+sk+(sk==1?" día":" días")+" cuidando la planta 🔥":"Sin racha todavía: regá hoy para empezar una.";
renderHist();var bn=document.getElementById("banner");
if(full||s>=1){bn.style.display="block";bn.textContent=full?"La regadera está llena: ¡regá la planta!":"Tu planta tiene sed: cumplí metas para llenar la regadera."}else bn.style.display="none";

function req(m,id,body){return fetch(API+(id||""),{method:m,headers:{"Content-Type":"application/json","Accept":"application/json"},body:body}).then(function(r){if(!r.ok)throw r.status;return r})}
function showCode(){var c=!!CODE;document.getElementById("scr").hidden=c;document.getElementById("sjn").hidden=c;document.getElementById("sco").hidden=!c;document.getElementById("scv").textContent=CODE}
function setCode(c){CODE=c;try{c?localStorage.setItem(CK,c):localStorage.removeItem(CK)}catch(e){}showCode()}
function payload(){return JSON.stringify({s:JSON.stringify(S),mod:S.mod||0})}
function push(){if(!CODE)return;clearTimeout(spt);spt=setTimeout(function(){req("PUT",CODE,payload()).then(function(){syncMsg("☁️ Sincronizado")}).catch(function(e){if(e===404)create();else syncMsg("☁️ Sin conexión: se guarda acá y reintenta en el próximo cambio")})},800)}
function create(){syncMsg("Creando código…");if(!S.mod)S.mod=Date.now();return req("POST","",payload()).then(function(r){var l=r.headers.get("Location"),id=l&&l.split("/").pop();if(!id)throw 0;setCode(id);syncMsg("☁️ Listo. Escribí este código en tu otro dispositivo.")}).catch(function(){syncMsg("No se pudo crear el código. Probá de nuevo más tarde.")})}
function applyRemote(d){var o=JSON.parse(d.s);S=fresh();merge(o);S.mod=d.mod;saveLocal();fillRt();fillDays();render();syncMsg("☁️ Sincronizado")}
function pull(d){if(!d||!d.s||!(d.mod>(S.mod||0)))return false;try{applyRemote(d)}catch(e){}return true}
function check(){if(!CODE||document.hidden)return;req("GET",CODE).then(function(r){return r.json()}).then(function(d){if(!pull(d)&&d&&d.mod<(S.mod||0))push();else if(d&&d.mod===S.mod)syncMsg("☁️ Sincronizado")}).catch(function(e){if(e===404)create();else syncMsg("☁️ Sin conexión: se guarda acá y reintenta")})}
document.getElementById("scr").onclick=create;
document.getElementById("scj").onclick=function(){var c=document.getElementById("sci").value.trim();if(!/^[\w-]{6,64}$/.test(c)){syncMsg("Ese código no parece válido.");return}
syncMsg("Conectando…");req("GET",c).then(function(r){return r.json()}).then(function(d){if(!d||!d.s)throw 0;setCode(c);applyRemote(d);say("¡Conectado! Tu planta ya está acá 🌱")}).catch(function(){syncMsg("No encontré ese código. Revisá que esté completo.")})};
document.getElementById("scc").onclick=function(){try{navigator.clipboard.writeText(CODE).then(function(){say("Código copiado. Mandátelo por WhatsApp o mail para usarlo en el otro dispositivo.")})}catch(e){say("Copiá el código a mano.")}};
document.getElementById("scx").onclick=function(){setCode("");syncMsg("📴 Desconectado: tus datos siguen en este dispositivo.")};
try{CODE=localStorage.getItem(CK)||""}catch(e){}
showCode();if(CODE)check();else syncMsg("📴 Solo en este dispositivo. Activá la sincronización para usarla en el celu y la PC.");
setInterval(check,30000);document.addEventListener("visibilitychange",check);
/* ---------- arranque ---------- */
function tick(){remind();remDaily();if(S.timer){if(Date.now()>=S.timer.end){var id=S.timer.id;S.timer=null;mark(id,true);if(navigator.vibrate)navigator.vibrate([300,150,300]);notify('¡Tiempo cumplido! 🌸','Sumaste 1 agua a la regadera.')}else{var bt=document.querySelector('[data-t="'+S.timer.id+'"]');if(bt)bt.textContent=fmt(S.timer.end-Date.now())+' · parar'}}}
nb();fillRt();fillDays();render();tick();var c=0;setInterval(function(){tick();if(++c%60==0&&EDIT===null)render()},1000);
</script>
</body>
</html>
